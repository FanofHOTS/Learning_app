# A generic, single database configuration.

[alembic]
script_location = %(here)s/alembic
prepend_sys_path = .

# Database URL - duoc cau hinh qua env.py va bien moi truong.
# Xem database/engine.py de biet chi tiet.
# - SQLite mac dinh: sqlite:///./learning_app.db
# - PostgreSQL: set DATABASE_URL hoac DATABASE_NAME + DATABASE_USER + ...
sqlalchemy.url = sqlite:///./learning_app.db

path_separator = os
output_encoding = utf-8

[post_write_hooks]

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
